# Model Configuration for Two-Phase Council System
# Updated architecture: T4 council + A100 4-way TP synthesis

# T4 Node - Council Members with Shared Prefill
t4_model:
  name: "microsoft/phi-2"  # 2.7B model, ~5GB in bf16
  node: "t4"
  gpus: [0, 1, 2, 3]  # GPU 0: prefill server, GPUs 1-3: members
  precision: "bf16"
  
# A100 Node - Synthesis Server with 4-way Tensor Parallelism
synthesis_model:
  name: "meta-llama/Llama-2-70b-chat-hf"  # 70B model, ~140GB total
  node: "a100"
  gpus: [0, 1, 2, 3]  # All 4 GPUs for 4-way TP
  tensor_parallel: 4
  precision: "bf16"
  
  # Two-phase workflow with KV cache reuse:
  # Phase 1: Prefill initial context (parallel with T4 generation), store KV cache
  # Phase 2: Append council results and synthesize (reuse KV cache)
  
  # Memory usage per GPU (with 4-way TP):
  # - Model shard: ~35GB
  # - KV cache: ~2.5GB (at 2048 tokens)
  # - Activations: ~2GB
  # Total: ~40GB / 80GB (50% utilization, plenty of headroom)
