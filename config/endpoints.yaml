# Endpoint Configuration for Two-Phase Council System
# Updated architecture: T4 council (3 members) + A100 synthesis (4-way TP)

# T4 Node - Council Members
# GPU 0 runs prefill server (internal, not exposed)
# GPUs 1-3 run member servers with different temperatures
members:
  - id: "member_1"
    url: "http://localhost:8001"
    temperature: 0.3  # Conservative/precise
    node: "t4"
    gpu: 1
  
  - id: "member_2"
    url: "http://localhost:8002"
    temperature: 0.7  # Balanced
    node: "t4"
    gpu: 2
  
  - id: "member_3"
    url: "http://localhost:8003"
    temperature: 1.0  # Creative/diverse
    node: "t4"
    gpu: 3

# A100 Node - Synthesis Server (4-way TP across GPUs 0-3)
# Two endpoints for two-phase workflow:
# - /prefill_initial: Phase 1 (store KV cache)
# - /synthesize_final: Phase 2 (reuse KV cache)
synthesis:
  url: "http://localhost:8020"
  node: "a100"
  gpus: [0, 1, 2, 3]

# Timeout settings (seconds)
timeouts:
  generation: 120      # T4 member generation timeout
  judgement: 60        # T4 peer ranking timeout
  synthesis: 180       # A100 synthesis timeout
  cache_timeout: 300   # 5 minutes - KV cache expiration

# Health check settings
health_check:
  interval: 30         # Check every 30 seconds
  timeout: 10          # 10 second timeout per check
