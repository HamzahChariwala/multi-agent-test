enabled: true
output_base_dir: "./profiling_traces"

# NOTE: Per-phase profiling - each HTTP request gets its own trace files

# Per-GPU profiling settings
# Each GPU generates ONE continuous trace per request, capturing all operations
gpus:
  t4_gpu0:
    enabled: true
    with_stack: false  # Stack traces add significant overhead
    record_shapes: false  # Shape recording adds overhead
  
  t4_gpu1:
    enabled: true
    with_stack: false
    record_shapes: false
  
  t4_gpu2:
    enabled: true
    with_stack: false
    record_shapes: false
  
  t4_gpu3:
    enabled: true
    with_stack: false
    record_shapes: false
  
  a100_gpu0:
    enabled: true
    with_stack: true
    record_shapes: true
  
  a100_gpu1:
    enabled: true
    with_stack: true
    record_shapes: true
  
  chairman_tp:
    enabled: true
    with_stack: true
    record_shapes: true

# ExecutionTraceObserver settings
execution_trace:
  enabled: true  # Enable for execution graph analysis
  export_format: "json"  # or "pickle"
  include_operator_inputs: false  # save space

# Profiling control
# Shorter schedule for lower overhead
schedule:
  wait: 0
  warmup: 0
  active: 2  # Profile for 2 steps only
  repeat: 1  # Must be >= 1 to trigger trace export

